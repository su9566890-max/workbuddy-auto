name: WorkBuddy Growth Probe (read-only)

# 临时探针：只验证成长中心只读接口在云端能不能通，不领奖、不开盒、不兑换。
# 探完就删这个文件。只能手动触发，不设定时。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run growth probe (GET only)
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_DOMAIN: www.codebuddy.cn
        run: python3 growth_probe.py
